{% if order.status == "completed" or order.status == "closed" %}<span class="badge badge--success">{{ order.get_status_display }}</span>{% elif order.status == "released" %}<span class="badge badge--warning">{{ order.get_status_display }}</span>{% elif order.status == "planned" %}<span class="badge badge--info">{{ order.get_status_display }}</span>{% else %}<span class="badge badge--neutral">{{ order.get_status_display }}</span>{% endif %}
