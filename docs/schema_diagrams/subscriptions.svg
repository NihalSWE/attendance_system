er"><text class="fieldtext target" x="625" y="199">FK → User.id</text></a></g><g><title>Inherited ActorTracked field.</title><text class="fieldtext" x="16" y="224">updated_by_id ?</text><text class="fieldtext nullable" x="470" y="224">bigint</text><a href="../ATTENDANCE_SCHEMA.html#table-User"><text class="fieldtext target" x="625" y="224">FK → User.id</text></a></g><rect x="1" y="234" width="978" height="25" fill="#f5f8fb"/><g><title>FK -&gt; Package, PROTECT.</title><text class="fieldtext" x="16" y="249">package_id</text><text class="fieldtext nullable" x="470" y="249">bigint</text><a href="#table-Package"><text class="fieldtext target" x="625" y="249">FK → Package.id</text></a></g><g><title>CharField.</title><text class="fieldtext" x="16" y="274">subscription_reference</text><text class="fieldtext nullable" x="470" y="274">varchar</text><text class="fieldtext" x="625" y="274"></text></g><rect x="1" y="284" width="978" height="25" fill="#f5f8fb"/><g><title>DateTimeField range.</title><text class="fieldtext" x="16" y="299">starts_at</text><text class="fieldtext nullable" x="470" y="299">timestamptz</text><text class="fieldtext" x="625" y="299"></text></g><g><title>DateTimeField range.</title><text class="fieldtext" x="16" y="324">ends_at</text><text class="fieldtext nullable" x="470" y="324">timestamptz</text><text class="fieldtext" x="625" y="324"></text></g><rect x="1" y="334" width="978" height="25" fill="#f5f8fb"/><g><title>nullable DateTimeField.</title><text class="fieldtext" x="16" y="349">trial_ends_at ?</text><text class="fieldtext nullable" x="470" y="349">timestamptz</text><text class="fieldtext" x="625" y="349"></text></g><g><title>nullable DateTimeField.</title><text class="fieldtext" x="16" y="374">cancelled_at ?</text><text class="fieldtext nullable" x="470" y="374">timestamptz</text><text class="fieldtext" x="625" y="374"></text></g><rect x="1" y="384" width="978" height="25" fill="#f5f8fb"/><g><title>trial, active, past_due, suspended, cancelled, expired.</title><text class="fieldtext" x="16" y="399">status</text><text class="fieldtext nullable" x="470" y="399">varchar</text><text class="fieldtext" x="625" y="399"></text></g><g><title>CharField snapshot.</title><text class="fieldtext" x="16" y="424">billing_interval</text><text class="fieldtext nullable" x="470" y="424">varchar</text><text class="fieldtext" x="625" y="424"></text></g><rect x="1" y="434" width="978" height="25" fill="#f5f8fb"/><g><title>DecimalField money.</title><text class="fieldtext" x="16" y="449">price_snapshot</text><text class="fieldtext nullable" x="470" y="449">numeric(18,2)</text><text class="fieldtext" x="625" y="449"></text></g><g><title>CharField(3).</title><text class="fieldtext" x="16" y="474">currency</text><text class="fieldtext nullable" x="470" y="474">varchar(3)</text><text class="fieldtext" x="625" y="474"></text></g><rect x="1" y="484" width="978" height="25" fill="#f5f8fb"/><g><title>nullable PositiveIntegerField.</title><text class="fieldtext" x="16" y="499">employee_limit_snapshot ?</text><text class="fieldtext nullable" x="470" y="499">integer</text><text class="fieldtext" x="625" y="499"></text></g><g><title>nullable PositiveIntegerField.</title><text class="fieldtext" x="16" y="524">user_limit_snapshot ?</text><text class="fieldtext nullable" x="470" y="524">integer</text><text class="fieldtext" x="625" y="524"></text></g><rect x="1" y="534" width="978" height="25" fill="#f5f8fb"/><g><title>nullable PositiveIntegerField.</title><text class="fieldtext" x="16" y="549">device_limit_snapshot ?</text><text class="fieldtext nullable" x="470" y="549">integer</text><text class="fieldtext" x="625" y="549"></text></g><g><title>nullable PositiveIntegerField.</title><text class="fieldtext" x="16" y="574">branch_limit_snapshot ?</text><text class="fieldtext nullable" x="470" y="574">integer</text><text class="fieldtext" x="625" y="574"></text></g><rect x="1" y="584" width="978" height="25" fill="#f5f8fb"/><g><title>JSONField immutable commercial snapshot of feature codes and limits.</title><text class="fieldtext" x="16" y="599">feature_snapshot</text><text class="fieldtext nullable" x="470" y="599">jsonb</text><text class="fieldtext" x="625" y="599"></text></g><g><title>optional CharField.</title><text class="fieldtext" x="16" y="624">external_customer_id ?</text><text class="fieldtext nullable" x="470" y="624">varchar</text><text class="fieldtext" x="625" y="624"></text></g><rect x="1" y="634" width="978" height="25" fill="#f5f8fb"/><g><title>optional CharField.</title><text class="fieldtext" x="16" y="649">external_subscription_id ?</text><text class="fieldtext nullable" x="470" y="649">varchar</text><text class="fieldtext" x="625" y="649"></text></g><g><title>BooleanField.</title><text class="fieldtext" x="16" y="674">auto_renew</text><text class="fieldtext nullable" x="470" y="674">boolean</text><text class="fieldtext" x="625" y="674"></text></g><rect x="1" y="684" width="978" height="25" fill="#f5f8fb"/><g><title>TextField, blank.</title><text class="fieldtext" x="16" y="699">cancellation_reason</text><text class="fieldtext nullable" x="470" y="699">text</text><text class="fieldtext" x="625" y="699"></text></g></g></svg>