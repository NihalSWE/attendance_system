<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3340" height="1100" viewBox="0 0 3340 1100" role="img" aria-labelledby="diagram-title"><title id="diagram-title">subscriptions · all table fields</title><desc>Complete table fields, types, and foreign key targets. Arrowheads point from child foreign keys to parent primary keys.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8798"/></marker></defs><style>text{font-family:Consolas,monospace;fill:#23354a}.heading{font-family:Segoe UI,Arial,sans-serif}.edge{fill:none;stroke:#8b9aad;stroke-width:1.4;opacity:.18;marker-end:url(#arrow)}.edge.shared{opacity:.07}.edge.active{stroke:#db6c28;stroke-width:3;opacity:.9}.table .border{fill:white;stroke:#c8d2df;stroke-width:1.3}.table.selected .border{stroke:#dc712b;stroke-width:4}.table.dim{opacity:.22}.fieldtext{font-size:13px}.target{fill:#28648c}.nullable{fill:#7e8995}.table{cursor:pointer}</style><rect width="100%" height="100%" fill="#f3f6fa"/><text x="80" y="65" class="heading" font-size="34" font-weight="700">subscriptions · all table fields</text><text x="80" y="104" class="heading" font-size="18">3 tables · PK / FK / UQ · ? = nullable · proposed PostgreSQL types · every inherited column expanded</text><text x="80" y="133" class="heading" font-size="16">FK labels name the parent table. Diagram arrows point to its primary key. Global Django auth infrastructure is excluded.</text><g id="relation-lines"><path class="edge" data-from="PackageFeature" data-to="Package" data-field="package_id" d="M2160,359 H2180 V334 H1060"><title>PackageFeature.package_id → Package.id</title></path><path class="edge" data-from="CompanySubscription" data-to="Package" data-field="package_id" d="M3260,484 H3285 V334 H1060"><title>CompanySubscription.package_id → Package.id</title></path></g><g class="table" id="table-Package" data-name="Package" tabindex="0" aria-label="Package table" transform="translate(80,240)"><rect class="border" rx="8" width="980" height="570"/><path d="M8 0 H972 Q980 0 980 8 V58 H0 V8 Q0 0 8 0" fill="#8c671e"/><text x="16" y="25" class="heading" style="fill:white" font-size="21" font-weight="600">Package</text><text x="16" y="46" style="fill:#e7edf6" font-size="13">subscriptions_package</text><text x="470" y="76" font-size="11" fill="#7f8996">TYPE</text><text x="625" y="76" font-size="11">FOREIGN KEY TARGET / KEY</text><rect x="1" y="84" width="978" height="25" fill="#f5f8fb"/><g><title>BigAutoField, PK.</title><text class="fieldtext" x="16" y="99">id</text><text class="fieldtext nullable" x="470" y="99">bigint</text><text class="fieldtext" x="625" y="99">PK</text></g><g><title>unique CharField.</title><text class="fieldtext" x="16" y="124">code</text><text class="fieldtext nullable" x="470" y="124">varchar</text><text class="fieldtext" x="625" y="124">UQ</text></g><rect x="1" y="134" width="978" height="25" fill="#f5f8fb"/><g><title>unique CharField.</title><text class="fieldtext" x="16" y="149">name</text><text class="fieldtext nullable" x="470" y="149">varchar</text><text class="fieldtext" x="625" y="149">UQ</text></g><g><title>TextField, blank.</title><text class="fieldtext" x="16" y="174">description</text><text class="fieldtext nullable" x="470" y="174">text</text><text class="fieldtext" x="625" y="174"></text></g><rect x="1" y="184" width="978" height="25" fill="#f5f8fb"/><g><title>monthly, yearly, custom.</title><text class="fieldtext" x="16" y="199">billing_interval</text><text class="fieldtext nullable" x="470" y="199">varchar</text><text class="fieldtext" x="625" y="199"></text></g><g><title>DecimalField money/CharField(3).</title><text class="fieldtext" x="16" y="224">price</text><text class="fieldtext nullable" x="470" y="224">numeric(18,2)</text><text class="fieldtext" x="625" y="224"></text></g><rect x="1" y="234" width="978" height="25" fill="#f5f8fb"/><g><title>DecimalField money/CharField(3).</title><text class="fieldtext" x="16" y="249">currency</text><text class="fieldtext nullable" x="470" y="249">varchar(3)</text><text class="fieldtext" x="625" y="249"></text></g><g><title>nullable PositiveIntegerField; null means unlimited.</title><text class="fieldtext" x="16" y="274">included_employee_limit ?</text><text class="fieldtext nullable" x="470" y="274">integer</text><text class="fieldtext" x="625" y="274"></text></g><rect x="1" y="284" width="978" height="25" fill="#f5f8fb"/><g><title>nullable PositiveIntegerField if login-seat pricing is later offered.</title><text class="fieldtext" x="16" y="299">included_user_limit ?</text><text class="fieldtext nullable" x="470" y="299">integer</text><text class="fieldtext" x="625" y="299"></text></g><g><title>nullable PositiveIntegerField.</title><text class="fieldtext" x="16" y="324">device_limit ?</text><text class="fieldtext nullable" x="470" y="324">integer</text><text class="fieldtext" x="625" y="324"></text></g><rect x="1" y="334" width="978" height="25" fill="#f5f8fb"/><g><title>nullable PositiveIntegerField.</title><text class="fieldtext" x="16" y="349">branch_limit ?</text><text class="fieldtext nullable" x="470" y="349">integer</text><text class="fieldtext" x="625" y="349"></text></g><g><title>PositiveIntegerField.</title><text class="fieldtext" x="16" y="374">trial_days</text><text class="fieldtext nullable" x="470" y="374">integer</text><text class="fieldtext" x="625" y="374"></text></g><rect x="1" y="384" width="978" height="25" fill="#f5f8fb"/><g><title>BooleanField.</title><text class="fieldtext" x="16" y="399">is_public</text><text class="fieldtext nullable" x="470" y="399">boolean</text><text class="fieldtext" x="625" y="399"></text></g><g><title>BooleanField.</title><text class="fieldtext" x="16" y="424">is_active</text><text class="fieldtext nullable" x="470" y="424">boolean</text><text class="fieldtext" x="625" y="424"></text></g><rect x="1" y="434" width="978" height="25" fill="#f5f8fb"/><g><title>PositiveIntegerField.</title><text class="fieldtext" x="16" y="449">display_order</text><text class="fieldtext nullable" x="470" y="449">integer</text><text class="fieldtext" x="625" y="449"></text></g><g><title>nullable FK -&gt; User, SET_NULL.</title><text class="fieldtext" x="16" y="474">created_by_id ?</text><text class="fieldtext nullable" x="470" y="474">bigint</text><a href="../ATTENDANCE_SCHEMA.html#table-User"><text class="fieldtext target" x="625" y="474">FK → User.id</text></a></g><rect x="1" y="484" width="978" height="25" fill="#f5f8fb"/><g><title>nullable FK -&gt; User, SET_NULL.</title><text class="fieldtext" x="16" y="499">updated_by_id ?</text><text class="fieldtext nullable" x="470" y="499">bigint</text><a href="../ATTENDANCE_SCHEMA.html#table-User"><text class="fieldtext target" x="625" y="499">FK → User.id</text></a></g><g><title>DateTimeField.</title><text class="fieldtext" x="16" y="524">created_at</text><text class="fieldtext nullable" x="470" y="524">timestamptz</text><text class="fieldtext" x="625" y="524"></text></g><rect x="1" y="534" width="978" height="25" fill="#f5f8fb"/><g><title>DateTimeField.</title><text class="fieldtext" x="16" y="549">updated_at</text><text class="fieldtext nullable" x="470" y="549">timestamptz</text><text class="fieldtext" x="625" y="549"></text></g></g><g class="table" id="table-PackageFeature" data-name="PackageFeature" tabindex="0" aria-label="PackageFeature table" transform="translate(1180,240)"><rect class="border" rx="8" width="980" height="295"/><path d="M8 0 H972 Q980 0 980 8 V58 H0 V8 Q0 0 8 0" fill="#8c671e"/><text x="16" y="25" class="heading" style="fill:white" font-size="21" font-weight="600">PackageFeature</text><text x="16" y="46" style="fill:#e7edf6" font-size="13">subscriptions_package_feature</text><text x="470" y="76" font-size="11" fill="#7f8996">TYPE</text><text x="625" y="76" font-size="11">FOREIGN KEY TARGET / KEY</text><rect x="1" y="84" width="978" height="25" fill="#f5f8fb"/><g><title>BigAutoField, PK.</title><text class="fieldtext" x="16" y="99">id</text><text class="fieldtext nullable" x="470" y="99">bigint</text><text class="fieldtext" x="625" y="99">PK</text></g><g><title>FK -&gt; Package, CASCADE.</title><text class="fieldtext" x="16" y="124">package_id</text><text class="fieldtext nullable" x="470" y="124">bigint</text><a href="#table-Package"><text class="fieldtext target" x="625" y="124">FK → Package.id</text></a></g><rect x="1" y="134" width="978" height="25" fill="#f5f8fb"/><g><title>FK -&gt; Feature, PROTECT.</title><text class="fieldtext" x="16" y="149">feature_id</text><text class="fieldtext nullable" x="470" y="149">bigint</text><a href="../ATTENDANCE_SCHEMA.html#table-Feature"><text class="fieldtext target" x="625" y="149">FK → Feature.id</text></a></g><g><title>BooleanField.</title><text class="fieldtext" x="16" y="174">is_included</text><text class="fieldtext nullable" x="470" y="174">boolean</text><text class="fieldtext" x="625" y="174"></text></g><rect x="1" y="184" width="978" height="25" fill="#f5f8fb"/><g><title>nullable PositiveBigIntegerField.</title><text class="fieldtext" x="16" y="199">usage_limit ?</text><text class="fieldtext nullable" x="470" y="199">bigint</text><text class="fieldtext" x="625" y="199"></text></g><g><title>JSONField for validated feature-specific commercial limits.</title><text class="fieldtext" x="16" y="224">configuration</text><text class="fieldtext nullable" x="470" y="224">jsonb</text><text class="fieldtext" x="625" y="224"></text></g><rect x="1" y="234" width="978" height="25" fill="#f5f8fb"/><g><title>DateTimeField.</title><text class="fieldtext" x="16" y="249">created_at</text><text class="fieldtext nullable" x="470" y="249">timestamptz</text><text class="fieldtext" x="625" y="249"></text></g><g><title>DateTimeField.</title><text class="fieldtext" x="16" y="274">updated_at</text><text class="fieldtext nullable" x="470" y="274">timestamptz</text><text class=