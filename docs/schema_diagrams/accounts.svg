able" x="470" y="99">bigint</text><text class="fieldtext" x="625" y="99">PK</text></g><g><title>companymembership_id</title><text class="fieldtext" x="16" y="124">companymembership_id</text><text class="fieldtext nullable" x="470" y="124">bigint</text><a href="#table-CompanyMembership"><text class="fieldtext target" x="625" y="124">FK → CompanyMembership.id</text></a></g><rect x="1" y="134" width="978" height="25" fill="#f5f8fb"/><g><title>department_id</title><text class="fieldtext" x="16" y="149">department_id</text><text class="fieldtext nullable" x="470" y="149">bigint</text><a href="../ATTENDANCE_SCHEMA.html#table-Department"><text class="fieldtext target" x="625" y="149">FK → Department.id</text></a></g></g></svg>