er, company_admin, hr, manager, payroll_manager, employee, auditor.</title><text class="fieldtext" x="16" y="274">role</text><text class="fieldtext nullable" x="470" y="274">varchar</text><text class="fieldtext" x="625" y="274"></text></g><rect x="1" y="284" width="978" height="25" fill="#f5f8fb"/><g><title>CharField choices: invited, active, suspended, ended.</title><text class="fieldtext" x="16" y="299">status</text><text class="fieldtext nullable" x="470" y="299">varchar</text><text class="fieldtext" x="625" y="299"></text></g><g><title>nullable DateTimeField.</title><text class="fieldtext" x="16" y="324">joined_at ?</text><text class="fieldtext nullable" x="470" y="324">timestamptz</text><text class="fieldtext" x="625" y="324"></text></g><rect x="1" y="334" width="978" height="25" fill="#f5f8fb"/><g><title>nullable DateTimeField.</title><text class="fieldtext" x="16" y="349">ended_at ?</text><text class="fieldtext nullable" x="470" y="349">timestamptz</text><text class="fieldtext" x="625" y="349"></text></g><g><title>nullable FK -&gt; User, SET_NULL.</title><text class="fieldtext" x="16" y="374">invited_by_id ?</text><text class="fieldtext nullable" x="470" y="374">bigint</text><a href="#table-User"><text class="fieldtext target" x="625" y="374">FK → User.id</text></a></g><rect x="1" y="384" width="978" height="25" fill="#f5f8fb"/><g><title>nullable DateTimeField.</title><text class="fieldtext" x="16" y="399">last_access_at ?</text><text class="fieldtext nullable" x="470" y="399">timestamptz</text><text class="fieldtext" x="625" y="399"></text></g></g><g class="table" id="table-CompanyMembership_allowed_branches" data-name="CompanyMembership_allowed_branches" tabindex="0" aria-label="CompanyMembership_allowed_branches table" transform="translate(2280,240)"><rect class="border" rx="8" width="980" height="170"/><path d="M8 0 H972 Q980 0 980 8 V58 H0 V8 Q0 0 8 0" fill="#255f85"/><text x="16" y="25" class="heading" style="fill:white" font-size="21" font-weight="600"