<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3340" height="1145" viewBox="0 0 3340 1145" role="img" aria-labelledby="diagram-title"><title id="diagram-title">accounts · all table fields</title><desc>Complete table fields, types, and foreign key targets. Arrowheads point from child foreign keys to parent primary keys.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8798"/></marker></defs><style>text{font-family:Consolas,monospace;fill:#23354a}.heading{font-family:Segoe UI,Arial,sans-serif}.edge{fill:none;stroke:#8b9aad;stroke-width:1.4;opacity:.18;marker-end:url(#arrow)}.edge.shared{opacity:.07}.edge.active{stroke:#db6c28;stroke-width:3;opacity:.9}.table .border{fill:white;stroke:#c8d2df;stroke-width:1.3}.table.selected .border{stroke:#dc712b;stroke-width:4}.table.dim{opacity:.22}.fieldtext{font-size:13px}.target{fill:#28648c}.nullable{fill:#7e8995}.table{cursor:pointer}</style><rect width="100%" height="100%" fill="#f3f6fa"/><text x="80" y="65" class="heading" font-size="34" font-weight="700">accounts · all table fields</text><text x="80" y="104" class="heading" font-size="18">4 tables · PK / FK / UQ · ? = nullable · proposed PostgreSQL types · every inherited column expanded</text><text x="80" y="133" class="heading" font-size="16">FK labels name the parent table. Diagram arrows point to its primary key. Global Django auth infrastructure is excluded.</text><g id="relation-lines"><path class="edge shared" data-from="CompanyMembership" data-to="User" data-field="created_by_id" d="M2160,434 H2180 V334 H1060"><title>CompanyMembership.created_by_id → User.id</title></path><path class="edge shared" data-from="CompanyMembership" data-to="User" data-field="updated_by_id" d="M2160,459 H2185 V334 H1060"><title>CompanyMembership.updated_by_id → User.id</title></path><path class="edge" data-from="CompanyMembership" data-to="User" data-field="user_id" d="M2160,484 H2190 V334 H1060"><title>CompanyMembership.user_id → User.id</title></path><path class="edge" data-from="CompanyMembership" data-to="User" data-field="invited_by_id" d="M2160,609 H2195 V334 H1060"><title>CompanyMembership.invited_by_id → User.id</title></path><path class="edge" data-from="CompanyMembership_allowed_branches" data-to="CompanyMembership" data-field="companymembership_id" d="M3260,359 H3300 V334 H2160"><title>CompanyMembership_allowed_branches.companymembership_id → CompanyMembership.id</title></path><path class="edge" data-from="CompanyMembership_allowed_departments" data-to="CompanyMembership" data-field="companymembership_id" d="M1060,954 H2205 V334 H2160"><title>CompanyMembership_allowed_departments.companymembership_id → CompanyMembership.id</title></path></g><g class="table" id="table-User" data-name="User" tabindex="0" aria-label="User table" transform="translate(80,240)"><rect class="border" rx="8" width="980" height="495"/><path d="M8 0 H972 Q980 0 980 8 V58 H0 V8 Q0 0 8 0" fill="#255f85"/><text x="16" y="25" class="heading" style="fill:white" font-size="21" font-weight="600">User</text><text x="16" y="46" style="fill:#e7edf6" font-size="13">accounts_user</text><text x="470" y="76" font-size="11" fill="#7f8996">TYPE</text><text x="625" y="76" font-size="11">FOREIGN KEY TARGET / KEY</text><rect x="1" y="84" width="978" height="25" fill="#f5f8fb"/><g><title>BigAutoField, PK.</title><text class="fieldtext" x="16" y="99">id</text><text class="fieldtext nullable" x="470" y="99">bigint</text><text class="fieldtext" x="625" y="99">PK</text></g><g><title>EmailField, unique, login identifier.</title><text class="fieldtext" x="16" y="124">email</text><text class="fieldtext nullable" x="470" y="124">varchar</text><text class="fieldtext" x="625" y="124">UQ</text></g><rect x="1" y="134" width="978" height="25" fill="#f5f8fb"/><g><title>CharField, unique compatibility identifier if retaining AbstractUser; generated/internal when login is email.</title><text class="fieldtext" x="16" y="149">username</text><text class="fieldtext nullable" x="470" y="149">varchar</text><text class="fieldtext" x="625" y="149">UQ</text></g><g><title>CharField.</title><text class="fieldtext" x="16" y="174">first_name</text><text class="fieldtext nullable" x="470" y="174">varchar</text><text class="fieldtext" x="625" y="174"></text></g><rect x="1" y="184" width="978" height="25" fill="#f5f8fb"/><g><title>CharField.</title><text class="fieldtext" x="16" y="199">last_name</text><text class="fieldtext nullable" x="470" y="199">varchar</text><text class="fieldtext" x="625" y="199"></text></g><g><title>CharField, blank.</title><text class="fieldtext" x="16" y="224">phone</text><text class="fieldtext nullable" x="470" y="224">varchar</text><text class="fieldtext" x="625" y="224"></text></g><rect x="1" y="234" width="978" height="25" fill="#f5f8fb"/><g><title>CharField preferences.</title><text class="fieldtext" x="16" y="249">timezone</text><text class="fieldtext nullable" x="470" y="249">varchar</text><text class="fieldtext" x="625" y="249"></text></g><g><title>CharField preferences.</title><text class="fieldtext" x="16" y="274">language</text><text class="fieldtext nullable" x="470" y="274">varchar</text><text class="fieldtext" x="625" y="274"></text></g><rect x="1" y="284" width="978" height="25" fill="#f5f8fb"/><g><title>Django authentication fields.</title><text class="fieldtext" x="16" y="299">password</text><text class="fieldtext nullable" x="470" y="299">varchar</text><text class="fieldtext" x="625" y="299"></text></g><g><title>Django authentication fields.</title><text class="fieldtext" x="16" y="324">last_login ?</text><text class="fieldtext nullable" x="470" y="324">timestamptz</text><text class="fieldtext" x="625" y="324"></text></g><rect x="1" y="334" width="978" height="25" fill="#f5f8fb"/><g><title>Django authentication fields.</title><text class="fieldtext" x="16" y="349">date_joined</text><text class="fieldtext nullable" x="470" y="349">timestamptz</text><text class="fieldtext" x="625" y="349"></text></g><g><title>Django account flags. Platform root is `is_superuser=True`.</title><text class="fieldtext" x="16" y="374">is_active</text><text class="fieldtext nullable" x="470" y="374">boolean</text><text class="fieldtext" x="625" y="374"></text></g><rect x="1" y="384" width="978" height="25" fill="#f5f8fb"/><g><title>Django account flags. Platform root is `is_superuser=True`.</title><text class="fieldtext" x="16" y="399">is_staff</text><text class="fieldtext nullable" x="470" y="399">boolean</text><text class="fieldtext" x="625" y="399"></text></g><g><title>Django account flags. Platform root is `is_superuser=True`.</title><text class="fieldtext" x="16" y="424">is_superuser</text><text class="fieldtext nullable" x="470" y="424">boolean</text><text class="fieldtext" x="625" y="424"></text></g><rect x="1" y="434" width="978" height="25" fill="#f5f8fb"/><g><title>timestamps.</title><text class="fieldtext" x="16" y="449">created_at</text><text class="fieldtext nullable" x="470" y="449">timestamptz</text><text class="fieldtext" x="625" y="449"></text></g><g><title>timestamps.</title><text class="fieldtext" x="16" y="474">updated_at</text><text class="fieldtext nullable" x="470" y="474">timestamptz</text><text class="fieldtext" x="625" y="474"></text></g></g><g class="table" id="table-CompanyMembership" data-name="CompanyMembership" tabindex="0" aria-label="CompanyMembership table" transform="translate(1180,240)"><rect class="border" rx="8" width="980" height="420"/><path d="M8 0 H972 Q980 0 980 8 V58 H0 V8 Q0 0 8 0" fill="#255f85"/><text x="16" y="25" class="heading" style="fill:white" font-size="21" font-weight="600">CompanyMembership</text><text x="16" y="46" style="fill:#e7edf6" font-size="13">accounts_company_membership</text><text x="470" y="76" font-size="11" fill="#7f8996">TYPE</text><text x="625" y="76" font-size="11">FOREIGN KEY TARGET / KEY<