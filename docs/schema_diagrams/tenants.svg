<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3340" height="1100" viewBox="0 0 3340 1100" role="img" aria-labelledby="diagram-title"><title id="diagram-title">tenants · all table fields</title><desc>Complete table fields, types, and foreign key targets. Arrowheads point from child foreign keys to parent primary keys.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8798"/></marker></defs><style>text{font-family:Consolas,monospace;fill:#23354a}.heading{font-family:Segoe UI,Arial,sans-serif}.edge{fill:none;stroke:#8b9aad;stroke-width:1.4;opacity:.18;marker-end:url(#arrow)}.edge.shared{opacity:.07}.edge.active{stroke:#db6c28;stroke-width:3;opacity:.9}.table .border{fill:white;stroke:#c8d2df;stroke-width:1.3}.table.selected .border{stroke:#dc712b;stroke-width:4}.table.dim{opacity:.22}.fieldtext{font-size:13px}.target{fill:#28648c}.nullable{fill:#7e8995}.table{cursor:pointer}</style><rect width="100%" height="100%" fill="#f3f6fa"/><text x="80" y="65" class="heading" font-size="34" font-weight="700">tenants · all table fields</text><text x="80" y="104" class="heading" font-size="18">3 tables · PK / FK / UQ · ? = nullable · proposed PostgreSQL types · every inherited column expanded</text><text x="80" y="133" class="heading" font-size="16">FK labels name the parent table. Diagram arrows point to its primary key. Global Django auth infrastructure is excluded.</text><g id="relation-lines"><path class="edge shared" data-from="CompanyFeature" data-to="Company" data-field="company_id" d="M3260,359 H3280 V334 H1060"><title>CompanyFeature.company_id → Company.id</title></path><path class="edge" data-from="CompanyFeature" data-to="Feature" data-field="feature_id" d="M3260,434 H3285 V334 H2160"><title>CompanyFeature.feature_id → Feature.id</title></path></g><g class="table" id="table-Company" data-name="Company" tabindex="0" aria-label="Company table" transform="translate(80,240)"><rect class="border" rx="8" width="980" height="720"/><path d="M8 0 H972 Q980 0 980 8 V58 H0 V8 Q0 0 8 0" fill="#7047a2"/><text x="16" y="25" class="heading" style="fill:white" font-size="21" font-weight="600">Company</text><text x="16" y="46" style="fill:#e7edf6" font-size="13">tenants_company</text><text x="470" y="76" font-size="11" fill="#7f8996">TYPE</text><text x="625" y="76" font-size="11">FOREIGN KEY TARGET / KEY</text><rect x="1" y="84" width="978" height="25" fill="#f5f8fb"/><g><title>BigAutoField, PK.</title><text class="fieldtext" x="16" y="99">id</text><text class="fieldtext nullable" x="470" y="99">bigint</text><text class="fieldtext" x="625" y="99">PK</text></g><g><title>Inherited timestamp.</title><text class="fieldtext" x="16" y="124">created_at</text><text class="fieldtext nullable" x="470" y="124">timestamptz</text><text class="fieldtext" x="625" y="124"></text></g><rect x="1" y="134" width="978" height="25" fill="#f5f8fb"/><g><title>Inherited timestamp.</title><text class="fieldtext" x="16" y="149">updated_at</text><text class="fieldtext nullable" x="470" y="149">timestamptz</text><text class="fieldtext" x="625" y="149"></text></g><g><title>Inherited ActorTracked field.</title><text class="fieldtext" x="16" y="174">created_by_id ?</text><text class="fieldtext nullable" x="470" y="174">bigint</text><a href="../ATTENDANCE_SCHEMA.html#table-User"><text class="fieldtext target" x="625" y="174">FK → User.id</text></a></g><rect x="1" y="184" width="978" height="25" fill="#f5f8fb"/><g><title>Inherited ActorTracked field.</title><text class="fieldtext" x="16" y="199">updated_by_id ?</text><text class="fieldtext nullable" x="470" y="199">bigint</text><a href="../ATTENDANCE_SCHEMA.html#table-User"><text class="fieldtext target" x="625" y="199">FK → User.id</text></a></g><g><title>UUIDField, unique, immutable external identifier.</title><text class="fieldtext" x="16" y="224">public_id</text><text class="fieldtext nullable" x="470" y="224">uuid</text><text class="fieldtext" x="625" y="224">UQ</text></g><rect x="1" y="234" width="978" height="25" fill="#f5f8fb"/><g><title>unique CharField identifiers.</title><text class="fieldtext" x="16" y="249">code</text><text class="fieldtext nullable" x="470" y="249">varchar</text><text class="fieldtext" x="625" y="249">UQ</text></g><g><title>unique CharField identifiers.</title><text class="fieldtext" x="16" y="274">slug</text><text class="fieldtext nullable" x="470" y="274">varchar</text><text class="fieldtext" x="625" y="274">UQ</text></g><rect x="1" y="284" width="978" height="25" fill="#f5f8fb"/><g><title>CharField.</title><text class="fieldtext" x="16" y="299">name</text><text class="fieldtext nullable" x="470" y="299">varchar</text><text class="fieldtext" x="625" y="299"></text></g><g><title>CharField.</title><text class="fieldtext" x="16" y="324">legal_name</text><text class="fieldtext nullable" x="470" y="324">varchar</text><text class="fieldtext" x="625" y="324"></text></g><rect x="1" y="334" width="978" height="25" fill="#f5f8fb"/><g><title>CharField, default chosen during setup.</title><text class="fieldtext" x="16" y="349">timezone</text><text class="fieldtext nullable" x="470" y="349">varchar</text><text class="fieldtext" x="625" y="349"></text></g><g><title>CharField(3), ISO code.</title><text class="fieldtext" x="16" y="374">currency</text><text class="fieldtext nullable" x="470" y="374">varchar(3)</text><text class="fieldtext" x="625" y="374"></text></g><rect x="1" y="384" width="978" height="25" fill="#f5f8fb"/><g><title>CharField.</title><text class="fieldtext" x="16" y="399">language</text><text class="fieldtext nullable" x="470" y="399">varchar</text><text class="fieldtext" x="625" y="399"></text></g><g><title>CharField.</title><text class="fieldtext" x="16" y="424">country_code</text><text class="fieldtext nullable" x="470" y="424">varchar</text><text class="fieldtext" x="625" y="424"></text></g><rect x="1" y="434" width="978" height="25" fill="#f5f8fb"/><g><title>contact fields.</title><text class="fieldtext" x="16" y="449">email</text><text class="fieldtext nullable" x="470" y="449">varchar</text><text class="fieldtext" x="625" y="449"></text></g><g><title>contact fields.</title><text class="fieldtext" x="16" y="474">phone</text><text class="fieldtext nullable" x="470" y="474">varchar</text><text class="fieldtext" x="625" y="474"></text></g><rect x="1" y="484" width="978" height="25" fill="#f5f8fb"/><g><title>contact fields.</title><text class="fieldtext" x="16" y="499">address</text><text class="fieldtext nullable" x="470" y="499">text</text><text class="fieldtext" x="625" y="499"></text></g><g><title>optional CharField.</title><text class="fieldtext" x="16" y="524">registration_number ?</text><text class="fieldtext nullable" x="470" y="524">varchar</text><text class="fieldtext" x="625" y="524"></text></g><rect x="1" y="534" width="978" height="25" fill="#f5f8fb"/><g><title>optional CharField.</title><text class="fieldtext" x="16" y="549">tax_identifier ?</text><text class="fieldtext nullable" x="470" y="549">varchar</text><text class="fieldtext" x="625" y="549"></text></g><g><title>optional ImageField/private media reference.</title><text class="fieldtext" x="16" y="574">logo ?</text><text class="fieldtext nullable" x="470" y="574">varchar</text><text class="fieldtext" x="625" y="574"></text></g><rect x="1" y="584" width="978" height="25" fill="#f5f8fb"/><g><title>choices: trial, active, suspended, inactive.</title><text class="fieldtext" x="16" y="599">status</text><text class="fieldtext nullable" x="470" y="599">varchar</text><text class="fieldtext" x="625" y="599"></text></g><g><title>nullable DateTimeField.</title><text class="fieldtext" x="16" y="624">activated_at ?</text><text class="fieldtext nullable" x="470" y="624">timestamptz</text><text class="fieldtext" x="625" y="624"></text></g><rect x="1" y="634" width="978" height="25" fill="#f5f8fb"/><g><title>nullable DateTimeField.</title><text class="fieldtext" x="16" y="649">suspended_at ?</text><text class="fieldtext nullable" x="470" y="649">timestamptz</text><text class="fieldtext" x="625" y="649"></text></g><g><title>nullable FK -&gt; User, SET_NULL.</title><text class="fieldtext" x="16" y="674">suspended_by_id ?</text><text class="fieldtext nullable" x="470" y="674">bigint</text><a href="../ATTENDANCE_SCHEMA.html#table-User"><text class="fieldtext target" x="625" y="674">FK → User.id</text></a></g><rect x="1" y="684" width="978" height="25" fill="#f5f8fb"/><g><title>TextField, blank.</title><text class="fieldtext" x="16" y="699">suspension_reason</text><text class="fieldtext nullable" x="470" y="699">text</text><text class="fieldtext" x="625" y="699"></text></g></g><g class="table" id="table-Feature" data-name="Feature" tabindex="0" aria-label="Feature table" transform="translate(1180,240)"><rect class="border" rx="8" width="980" height="320"/><path d="M8 0 H972 Q980 0 980 8 V58 H0 V8 Q0 0 8 0" fill="#7047a2"/><text x="16" y="25" class="heading" style="fill:white" font-size="21" font-weight="600">Feature</text><text x="16" y="46" style="fill:#e7edf6" font-size="13">tenants_feature</text><text x="470" y="76" font-size="11" fill="#7f8996">TYPE</text><text x="625" y="76" font-size="11">FOREIGN KEY TARGET / KEY</text><rect x="1" y="84" width="978" height="25" fill="#f5f8fb"/><g><title>BigAutoField, PK.</title><text class="fieldtext" x="16" y="99">id</text><text class="fieldtext nullable" x="470" y="99">bigint</text><text class="fieldtext" x="625" y="99">PK</text></g><g><title>CharField, unique, such as attendance, leave, payroll.</title><text class="fieldtext" x="16" y="124">code</text><text class="fieldtext nullable" x="470" y="124">varchar</text><text class="fieldtext" x="625" y="124">UQ</text></g><rect x="1" y="134" width="978" height="25" fill="#f5f8fb"/><g><title>display fields.</title><text class="fieldtext" x="16" y="149">name</text><text class="fieldtext nullable" x="470" y="149">varchar</text><text class="fieldtext" x="625" y="149"></text></g><g><title>display fields.</title><text class="fieldtext" x="16" y="174">description</text><text class="fieldtext nullable" x="470" y="174">text</text><text class="fieldtext" x="625" y="174"></text></g><rect x="1" y="184" width="978" height="25" fill="#f5f8fb"/><g><title>BooleanField; core features cannot be removed from eligible packages.</title><text class="fieldtext" x="16" y="199">is_core</text><text class="fieldtext nullable" x="470" y="199">boolean</text><text class="fieldtext" x="625" y="199"></text></g><g><title>BooleanField.</title><text class="fieldtext" x="16" y="224">is_active</text><text class="fieldtext nullable" x="470" y="224">boolean</text><text class="fieldtext" x="625" y="224"></text></g><rect x="1" y="234" width="978" height="25" fill="#f5f8fb"/><g><title>PositiveIntegerField.</title><text class="fieldtext" x="16" y="249">sort_order</text><text class="fieldtext nullable" x="470" y="249">integer</text><text class="fieldtext" x="625" y="249"></text></g><g><title>timestamps.</title><text class="fieldtext" x="16" y="274">created_at</text><text class="fieldtext nullable" x="470" y="274">timestamptz</text><text class="fieldtext" x="625" y="274"></text></g><rect x="1" y="284" width="978" height="25" fill="#f5f8fb"/><g><title>timestamps.</title><text class="fieldtext" x="16" y="299">updated_at</text><text class="fieldtext nullable" x="470" y="299">timestamptz</text><text class="fieldtext" x="625" y="299"></text></g></g><g class="table" id="table-CompanyFeature" data-name="CompanyFeature" tabindex="0" aria-label="CompanyFeature table" transform="translate(2280,240)"><rect class="border" rx="8" width="980" height="395"/><path d="M8 0 H972 Q980 0 980 8 V58 H0 V8 Q0 0 8 0" fill="#7047a2"/><text x="16" y="25" class="heading" style="fill:white" font-size="21" font-weight="600">CompanyFeature</text><text x="16" y="46" style="fill:#e7edf6" font-size="13">tenants_company_feature</text><text x="470" y="76" font-size="11" fill="#7f8996">TYPE</text><text x="625" y="76" font-size="11">FOREIGN KEY TARGET / KEY</text><rect x="1" y="84" width="978" height="25" fill="#f5f8fb"/><g><title>Primary key; BigAutoField.</title><text class="fieldtext" x="16" y="99">id</text><text class="fieldtext nullable" x="470" y="99">bigint</text><text class="fieldtext" x="625" y="99">PK</text></g><g><title>TenantOwned.company; mandatory tenant ownership.</title><text class="fieldtext" x="16" y="124">company_id</text><text class="fieldtext nullable" x="470" y="124">bigint</text><a href="#table-Company"><text class="fieldtext target" x="625" y="124">FK → Company.id</text></a></g><rect x="1" y="134" width="978" height="25" fill="#f5f8fb"/><g><title>Inherited timestamp.</title><text class="fieldtext" x="16" y="149">created_at</text><text class="fieldtext nullable" x="470" y="149">timestamptz</text><text class="fieldtext" x="625" y="149"></text></g><g><title>Inherited timestamp.</title><text class="fieldtext" x="16" y="174">updated_at</text><text class="fieldtext nullable" x="470" y="174">timestamptz</text><text class="fieldtext" x="625" y="174"></text></g><rect x="1" y="184" width="978" height="25" fill="#f5f8fb"/><g><title>FK -&gt; Feature, PROTECT.</title><text class="fieldtext" x="16" y="199">feature_id</text><text class="fieldtext nullable" x="470" y="199">bigint</text><a href="#table-Feature"><text class="fieldtext target" x="625" y="199">FK → Feature.id</text></a></g><g><title>choices: enable, disable.</title><text class="fieldtext" x="16" y="224">effect</text><text class="fieldtext nullable" x="470" y="224">varchar</text><text class="fieldtext" x="625" y="224"></text></g><rect x="1" y="234" width="978" height="25" fill="#f5f8fb"/><g><title>nullable DateTimeField.</title><text class="fieldtext" x="16" y="249">starts_at ?</text><text class="fieldtext nullable" x="470" y="249">timestamptz</text><text class="fieldtext" x="625" y="249"></text></g><g><title>nullable DateTimeField.</title><text class="fieldtext" x="16" y="274">ends_at ?</text><text class="fieldtext nullable" x="470" y="274">timestamptz</text><text class="fieldtext" x="625" y="274"></text></g><rect x="1" y="284" width="978" height="25" fill="#f5f8fb"/><g><title>JSONField for feature-specific scalar limits, validated by feature.</title><text class="fieldtext" x="16" y="299">limits</text><text class="fieldtext nullable" x="470" y="299">jsonb</text><text class="fieldtext" x="625" y="299"></text></g><g><title>TextField.</title><text class="fieldtext" x="16" y="324">reason</text><text class="fieldtext nullable" x="470" y="324">text</text><text class="fieldtext" x="625" y="324"></text></g><rect x="1" y="334" width="978" height="25" fill="#f5f8fb"/><g><title>FK -&gt; User, PROTECT.</title><text class="fieldtext" x="16" y="349">granted_by_id</text><text class="fieldtext nullable" x="470" y="349">bigint</text><a href="../ATTENDANCE_SCHEMA.html#table-User"><text class="fieldtext target" x="625" y="349">FK → User.id</text></a></g><g><title>BooleanField.</title><text class="fieldtext" x="16" y="374">is_active</text><text class="fieldtext nullable" x="470" y="374">boolean</text><text class="fieldtext" x="625" y="374"></text></g></g></svg>