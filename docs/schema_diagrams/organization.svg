<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3340" height="975" viewBox="0 0 3340 975" role="img" aria-labelledby="diagram-title"><title id="diagram-title">organization · all table fields</title><desc>Complete table fields, types, and foreign key targets. Arrowheads point from child foreign keys to parent primary keys.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8798"/></marker></defs><style>text{font-family:Consolas,monospace;fill:#23354a}.heading{font-family:Segoe UI,Arial,sans-serif}.edge{fill:none;stroke:#8b9aad;stroke-width:1.4;opacity:.18;marker-end:url(#arrow)}.edge.shared{opacity:.07}.edge.active{stroke:#db6c28;stroke-width:3;opacity:.9}.table .border{fill:white;stroke:#c8d2df;stroke-width:1.3}.table.selected .border{stroke:#dc712b;stroke-width:4}.table.dim{opacity:.22}.fieldtext{font-size:13px}.target{fill:#28648c}.nullable{fill:#7e8995}.table{cursor:pointer}</style><rect width="100%" height="100%" fill="#f3f6fa"/><text x="80" y="65" class="heading" font-size="34" font-weight="700">organization · all table fields</text><text x="80" y="104" class="heading" font-size="18">3 tables · PK / FK / UQ · ? = nullable · proposed PostgreSQL types · every inherited column expanded</text><text x="80" y="133" class="heading" font-size="16">FK labels name the parent table. Diagram arrows point to its primary key. Global Django auth infrastructure is excluded.</text><g id="relation-lines"><path class="edge" data-from="Department" data-to="Branch" data-field="branch_id" d="M2160,484 H2180 V334 H1060"><title>Department.branch_id → Branch.id</title></path><path class="edge" data-from="Designation" data-to="Department" data-field="department_id" d="M3260,484 H3285 V334 H2160"><title>Designation.department_id → Department.id</title></path><path class="edge" data-from="Designation" data-to="Designation" data-fiel