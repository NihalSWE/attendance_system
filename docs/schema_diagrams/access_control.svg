<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3340" height="1095" viewBox="0 0 3340 1095" role="img" aria-labelledby="diagram-title"><title id="diagram-title">access_control · all table fields</title><desc>Complete table fields, types, and foreign key targets. Arrowheads point from child foreign keys to parent primary keys.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8798"/></marker></defs><style>text{font-family:Consolas,monospace;fill:#23354a}.heading{font-family:Segoe UI,Arial,sans-serif}.edge{fill:none;stroke:#8b9aad;stroke-width:1.4;opacity:.18;marker-end:url(#arrow)}.edge.shared{opacity:.07}.edge.active{stroke:#db6c28;stroke-width:3;opacity:.9}.table .border{fill:white;stroke:#c8d2df;stroke-width:1.3}.table.selected .border{stroke:#dc712b;stroke-width:4}.table.dim{opacity:.22}.fieldtext{font-size:13px}.target{fill:#28648c}.nullable{fill:#7e8995}.table{cursor:pointer}</style><rect width="100%" height="100%" fill="#f3f6fa"/><text x="80" y="65" class="heading" font-size="34" font-weight="700">access_control · all table fields</text><text x="80" y="104" class="heading" font-size="18">5 tables · PK / FK / UQ · ? = nullable · proposed PostgreSQL types · every inherited column expanded</text><text x="80" y="133" class="heading" font-size="16">FK labels name the parent table. Diagram arrows point to its primary key. Global Django auth infrastructure is excluded.</text><g id="relation-lines"><path class="edge" data-from="DesignationPermission" data-to="AccessPermission" data-field="permission_id" d="M2160,509 H2180 V334 H1060"><title>DesignationPermission.permission_id → AccessPermission.id</title></path><path class="edge" data-from="EmployeePermissionOverride" data-to="AccessPermission" data-field="permission_id" d="M3260,509 H3285 V334 H1060"><title>EmployeePermissionOverride.permission_id → AccessPermission.id</title></path><path class="edge" data-from="EmployeePermissionOverride_allowed_branches" data-to="EmployeePermissionOverride" data-field="employeepermissionoverride_id" d="M1060,904 H3290 V334 H3260"><title>EmployeePermissionOverride_allowed_branches.employeepermissionoverride_id → EmployeePermissionOverride.id</title></path><path class="edge" data-from="EmployeePermissionOverride_allowed_departments" data-to="EmployeePermissionOverride" data-field="employeepermissionoverride_id" d="M2160,904 H3295 V334 H3260"><title>EmployeePermissionOverride_allowed_departments.employeepermissionoverride_id → EmployeePermissionOverride.id</title></path></g><g class="table" id="table-AccessPermission" data-name="AccessPermission" tabindex="0" aria-label="AccessPermission table" transform="translate(80,240)"><rect class="border" rx="8" width="980" height="345"/><path d="M8 0 H972 Q980 0 980 8 V58 H0 V8 Q0 0 8 0" fill="#8d4378"/><text x="16" y="25" class="heading" style="fill:white" font-size="21" font-weight="600">AccessPermission</text><text x="16" y="46" style="fill:#e7edf6" font-size="13">access_control_accesspermission</text><text x="470" y="76" font-size="11" fill="#7f8996">TYPE</text><text x="625" y="76" font-size="11">FOREIGN KEY TARGET / KEY</text><rect x="1" y="84" width="978" height="25" fill="#f5f8fb"/><g><title>BigAutoField, PK.</title><text class="fieldtext" x="16" y="99">id</text><text class="fieldtext nullable" x="470" y="99">bigint</text><text class="fieldtext" x="625" y="99">PK</text></g><g><title>FK -&gt; Feature, PROTECT.</title><text class="fieldtext" x="16" y="124">feature_id</text><text class="fieldtext nullable" x="470" y="124">bigint</text><a href="../ATTENDANCE_SCHEMA.html#table-Feature"><text class="fieldtext target" x="625" y="124">FK → Feature.id</text></a></g><rect x="1" y="134" width="978" height="25" fill="#f5f8fb"/><g><title>CharField, globally unique, e.g. `leave.approve`.</title><text class="fieldtext" x="16" y="149">code</text><text class