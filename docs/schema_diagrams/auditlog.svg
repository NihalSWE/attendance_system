<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1140" height="1025" viewBox="0 0 1140 1025" role="img" aria-labelledby="diagram-title"><title id="diagram-title">auditlog · all table fields</title><desc>Complete table fields, types, and foreign key targets. Arrowheads point from child foreign keys to parent primary keys.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8798"/></marker></defs><style>text{font-family:Consolas,monospace;fill:#23354a}.heading{font-family:Segoe UI,Arial,sans-serif}.edge{fill:none;stroke:#8b9aad;stroke-width:1.4;opacity:.18;marker-end:url(#arrow)}.edge.shared{opacity:.07}.edge.active{stroke:#db6c28;stroke-width:3;opacity:.9}.table .border{fill:white;stroke:#c8d2df;stroke-width:1.3}.table.selected .border{stroke:#dc712b;stroke-width:4}.table.dim{opacity:.22}.fieldtext{font-size:13px}.target{fill:#28648c}.nullable{fill:#7e8995}.table{cursor:pointer}</style><rect width="100%" height="100%" fill="#f3f6fa"/><text x="80" y="65" class="heading" font-size="34" font-weight="700">auditlog · all table fields</text><text x="80" y="104" class="heading" font-size="18">1 tables · PK / FK / UQ · ? = nullable · proposed PostgreSQL types · every inherited column expanded</text><text x="80" y="133" class="heading" font-size="16">FK labels name the parent table. Diagram arrows point to its primary key. Global Django auth infrastructure is excluded.</text><g id="relation-lines"></g><g class="table" id="table-AuditLog" data-name="AuditLog" tabindex="0" aria-label="AuditLog table" transform="translate(80,240)"><rect class="border" rx="8" width="980" height="645"/><path d="M8 0 H972 Q980 0 980 8 V58 H0 V8 Q0 0 8 0" fill="#656679"/><text x="16" y="25" class="heading" style="fill:white" font-size="21" font-weight="600">AuditLog</text><text x="16" y="46" style="fill:#e7edf6" font-size="13">auditlog_auditlog</text><text x="470" y="76" font-size="11" fill="#7f8996">TYPE</text><text x="625" y="76" font-size="11">FOREIGN KEY TARGET / KEY</text><rect x="1" y="84" width="978" height="25" fill="#f5f8fb"/><g><title>BigAutoField, PK.</title><text class="fieldtext" x="16" y="99">id</text><text class="fieldtext nullable" x="470" y="99">bigint</text><text class="fieldtext" x="625" y="99">PK</text></g><g><title>nullable FK -&gt; Company, PROTECT; null only for platform-level actions.</title><text class="fieldtext" x="16" y="124">company_id ?</text><text class="fieldtext nullable" x="470" y="124">bigint</text><a href="../ATTENDANCE_SCHEMA.html#table-Company"><text class="fieldtext target" x="625" y="124">FK → Company.id</text></a></g><rect x="1" y="134" width="978" height="25" fill="#f5f8fb"/><g><title>nullable FK -&gt; User, SET_NULL.</title><text class="fieldtext" x="16" y="149">actor_user_id ?</text><text class="fieldtext nullable" x="470" y="149">bigint</text><a href="../ATTENDANCE_SCHEMA.html#table-User"><text class="fieldtext target" x="625" y="149">FK → User.id</text></a></g><g><title>nullable FK -&gt; CompanyMembership, SET_NULL.</title><text class="fieldtext" x="16" y="174">actor_membership_id ?</text><text class="fieldtext nullable" x="470" y="174">bigint</text><a href="../ATTENDANCE_SCHEMA.html#table-CompanyMembership"><text class="fieldtext target" x="625" y="174">FK → CompanyMembership.id</text></a></g><rect x="1" y="184" width="978" height="25" fill="#f5f8fb"/><g><title>user, system, device, background_job, root_admin.</title><text class="fieldtext" x="16" y="199">actor_type</text><text class="fieldtext nullable" x="470" y="199">varchar</text><text class="fieldtext" x="625" y="199"></text></g><g><title>CharField stable code such as employee.updated or payroll_run.posted.</title><text class="fieldtext" x="16" y="224">action</text><text class="fieldtext nullable" x="470" y="224">varchar</text><text class="fieldtext" x="625" y="224"></text></g><rect x="1" y="234" width="978" height="25" fill="#f5f8fb"/><g><title>CharField identifiers; use content types only if their operational tradeoff is accepted.</title><text class="fieldtext" x="16" y="249">object_app</text><text class="fieldtext nullable" x="470" y="249">varchar</text><text class="fieldtext" x="625" y="249"></text></g><g><title>CharField identifiers; use content types only if their operational tradeoff is accepted.</title><text class="fieldtext" x="16" y="274">object_model</text><text class="fieldtext nullable" x="470" y="274">varchar</text><text class="fieldtext" x="625" y="274"></text></g><rect x="1" y="284" width="978" height="25" fill="#f5f8fb"/><g><title>CharField identifiers; use content types only if their operational tradeoff is accepted.</title><text class="fieldtext" x="16" y="299">object_id</text><text class="fieldtext nullable" x="470" y="299">varchar</text><text class="fieldtext" x="625" y="299"></text></g><g><title>CharField identifiers; use content types only if their operational tradeoff is accepted.</title><text class="fieldtext" x="16" y="324">object_public_id</text><text class="fieldtext nullable" x="470" y="324">varchar</text><text class="fieldtext" x="625" y="324"></text></g><rect x="1" y="334" width="978" height="25" fill="#f5f8fb"/><g><title>CharField snapshot.</title><text class="fieldtext" x="16" y="349">object_display</text><text class="fieldtext nullable" x="470" y="349">varchar</text><text class="fieldtext" x="625" y="349"></text></g><g><title>optional CharField, indexed.</title><text class="fieldtext" x="16" y="374">request_id ?</text><text class="fieldtext nullable" x="470" y="374">varchar</text><text class="fieldtext" x="625" y="374"></text></g><rect x="1" y="384" width="978" height="25" fill="#f5f8fb"/><g><title>optional CharField, indexed.</title><text class="fieldtext" x="16" y="399">correlation_id ?</text><text class="fieldtext nullable" x="470" y="399">varchar</text><text class="fieldtext" x="625" y="399"></text></g><g><title>optional CharField, indexed.</title><text class="fieldtext" x="16" y="424">idempotency_key ?</text><text class="fieldtext nullable" x="470" y="424">varchar</text><text class="fieldtext" x="625" y="424"></text></g><rect x="1" y="434" width="978" height="25" fill="#f5f8fb"/><g><title>nullable GenericIPAddressField.</title><text class="fieldtext" x="16" y="449">ip_address ?</text><text class="fieldtext nullable" x="470" y="449">inet</text><text class="fieldtext" x="625" y="449"></text></g><g><title>TextField, blank.</title><text class="fieldtext" x="16" y="474">user_agent</text><text class="fieldtext nullable" x="470" y="474">text</text><text class="fieldtext" x="625" y="474"></text></g><rect x="1" y="484" width="978" height="25" fill="#f5f8fb"/><g><title>JSONField with sensitive values redacted.</title><text class="fieldtext" x="16" y="499">before_data</text><text class="fieldtext nullable" x="470" y="499">jsonb</text><text class="fieldtext" x="625" y="499"></text></g><g><title>JSONField with sensitive values redacted.</title><text class="fieldtext" x="16" y="524">after_data</text><text class="fieldtext nullable" x="470" y="524">jsonb</text><text class="fieldtext" x="625" y="524"></text></g><rect x="1" y="534" width="978" height="25" fill="#f5f8fb"/><g><title>JSONField with sensitive values redacted.</title><text class="fieldtext" x="16" y="549">metadata</text><text class="fieldtext nullable" x="470" y="549">jsonb</text><text class="fieldtext" x="625" y="549"></text></g><g><title>DateTimeField, indexed.</title><text class="fieldtext" x="16" y="574">occurred_at</text><text class="fieldtext nullable" x="470" y="574">timestamptz</text><text class="fieldtext" x="625" y="574"></text></g><rect x="1" y="584" width="978" height="25" fill="#f5f8fb"/><g><title>optional CharField for tamper-evident chaining.</title><text class="fieldtext" x="16" y="599">integrity_hash ?</text><text class="fieldtext nullable" x="470" y="599">varchar</text><text class="fieldtext" x="625" y="599"></text></g><g><title>optional CharField for tamper-evident chaining.</title><text class="fieldtext" x="16" y="624">previous_hash ?</text><text class="fieldtext nullable" x="470" y="624">varchar</text><text class="fieldtext" x="625" y="624"></text></g></g></svg>