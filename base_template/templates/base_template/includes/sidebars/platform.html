<aside class="sidebar" id="platform-sidebar" aria-label="Platform navigation">
    <div class="sidebar__brand">
        <span class="sidebar__mark">
            A
        </span>
        <span>
            Attendance
        </span>
    </div>
    <div class="sidebar__label">
        Platform
    </div>
    <a class="sidebar__link is-active" href="{% url 'platform:company_list' %}" aria-label="Companies">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M3 21h18M5 21V5l7-3 7 3v18M9 8h2m2 0h2M9 12h2m2 0h2M10 21v-5h4v5"/>
        </svg>
        <span>
            Companies
        </span>
    </a>
    <div class="sidebar__foot">
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="sidebar__link nav-button" type="submit" aria-label="Sign out">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="M15 17l5-5-5-5M20 12H9M12 20H6V4h6"/>
                </svg>
                <span>
                    Sign out
                </span>
            </button>
        </form>
    </div>
</aside>
