{% if page_obj %}
    <div class="card__body row">
        <span>{{ page_obj.paginator.count }} result(s) · Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
        {% if page_obj.has_previous %}
            <a class="btn btn--ghost btn--sm" href="{% querystring page=page_obj.previous_page_number %}">Previous</a>
        {% endif %}
        {% if page_obj.has_next %}
            <a class="btn btn--ghost btn--sm" href="{% querystring page=page_obj.next_page_number %}">Next</a>
        {% endif %}
    </div>
{% endif %}
