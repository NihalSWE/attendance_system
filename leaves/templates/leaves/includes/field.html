<div class="field">
    <label class="field__label" for="{{ field.id_for_label }}">
        {{ field.label }}
        {% if field.field.required %}
            <span class="field__req">
                *
            </span>
        {% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}
        <span class="field__help">
            {{ field.help_text }}
        </span>
    {% endif %}
    {% for error in field.errors %}
        <span class="field__error">
            {{ error }}
        </span>
    {% endfor %}
</div>
